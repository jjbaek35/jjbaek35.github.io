name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  checkout:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.matching.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Detect release version
        id: matching
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          message=$(git log -1 --format="%s")
          if [[ "$message" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          fi

  release:
    runs-on: ubuntu-latest
    needs: checkout
    if: ${{ needs.checkout.outputs.version != '' }}
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.checkout.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: "3.3"

      - name: Generate changelog and update version
        shell: bash
        run: |
          last_tag=$(git describe --tags --abbrev=0)
          git log "${last_tag}..HEAD" --no-merges --format="- %h %s @%an" > action.changelog.md
          sed -i "s/${last_tag:1}/${VERSION}/g" jekyll-rtd-theme.gemspec
          sed -i "s/${last_tag:1}/${VERSION}/g" _includes/rest/defaults.liquid

      - name: Install dependencies and build assets
        run: |
          npm ci
          npm run format
          npm run build

      - name: Commit release changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --title "${VERSION}" \
            --notes-file action.changelog.md \
            --target "$(git rev-parse HEAD)"

      - name: Configure gem credentials and build gem
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUBYGEMS_AUTH_TOKEN: ${{ secrets.RUBYGEMS_AUTH_TOKEN }}
        shell: bash
        run: |
          credentials="${HOME}/.gem/credentials"
          mkdir -p "${HOME}/.gem"
          umask 077
          printf '%s\n' \
            '---' \
            ":github: Bearer ${GITHUB_TOKEN}" \
            ":rubygems_api_key: ${RUBYGEMS_AUTH_TOKEN}" > "$credentials"
          gem build ./*.gemspec

      - name: Publish gems
        run: |
          gem push ./*.gem
          gem push --key github \
            --host "https://rubygems.pkg.github.com/${GITHUB_REPOSITORY_OWNER}" \
            ./*.gem
